<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="nexusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#f093fb" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Geometric Hexagonal Nexus -->
  <polygon points="50,12 83,31 83,69 50,88 17,69 17,31" stroke="url(#nexusGrad)" stroke-width="4.5" stroke-linejoin="round" fill="#080a12" fill-opacity="0.85" filter="url(#glow)"/>
  <!-- Inner Connecting Facets -->
  <line x1="50" y1="50" x2="50" y2="12" stroke="url(#nexusGrad)" stroke-width="3" stroke-linecap="round"/>
  <line x1="50" y1="50" x2="83" y2="69" stroke="url(#nexusGrad)" stroke-width="3" stroke-linecap="round"/>
  <line x1="50" y1="50" x2="17" y2="69" stroke="url(#nexusGrad)" stroke-width="3" stroke-linecap="round"/>
  <!-- Sovereign Core Pulse -->
  <circle cx="50" cy="50" r="7" fill="#00f2fe" filter="url(#glow)"/>
  <circle cx="50" cy="50" r="3" fill="#ffffff"/>
</svg>
