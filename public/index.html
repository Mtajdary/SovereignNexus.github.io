<!DOCTYPE html>
<html lang="fa" dir="rtl" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>PRIME CROWN | سیستم‌عامل معماری ذهن برتر و هوش استراتژیک</title>
    <meta name="description" content="سامانه حاکمیتی فرماندهی ذهن، جعبه‌ابزار مهندسی عمران، آزمایشگاه بینایی ماشین و هوش مصنوعی." />
    <meta name="theme-color" content="#000000" />
    <link rel="canonical" href="https://primecrown-co.github.io/" />

    <!-- SPA Clean URL Handler -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&') 
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Playfair+Display:wght@600;800&family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body class="antialiased selection:bg-amber-500/30 selection:text-amber-200">

  </body>
