<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- پس‌زمینه کیهانی عمیق -->
    <radialGradient id="pwaBg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#151b28" />
      <stop offset="60%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020408" />
    </radialGradient>

    <!-- گرادیان طلایی لوکس -->
    <linearGradient id="goldCrownGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0" />
      <stop offset="25%" stop-color="#FDE047" />
      <stop offset="60%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#854D0E" />
    </linearGradient>

    <!-- گرادیان بال‌های کناری کریستالی -->
    <linearGradient id="blueFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <linearGradient id="emeraldFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- افکت هاله نورانی -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- کادر آیکون -->
  <rect width="512" height="512" rx="128" fill="url(#pwaBg)" stroke="#D4AF37" stroke-width="4" stroke-opacity="0.5" />

  <!-- هاله نورانی در مرکز -->
  <circle cx="256" cy="270" r="140" fill="#F59E0B" opacity="0.18" filter="url(#goldGlow)" />

  <g filter="url(#goldGlow)" transform="translate(0, 15)">
    <!-- پایه تاج -->
    <path d="M120 350 Q 256 385 392 350 L380 372 Q 256 405 132 372 Z" fill="url(#goldCrownGrad)" />

    <!-- وجه کریستالی چپ -->
    <polygon points="130,340 165,195 215,280 180,340" fill="url(#blueFacet)" />
    <polygon points="165,195 256,240 215,280" fill="#2563EB" opacity="0.8" />

    <!-- وجه کریستالی راست -->
    <polygon points="382,340 347,195 297,280 332,340" fill="url(#emeraldFacet)" />
    <polygon points="347,195 297,280 256,240" fill="#059669" opacity="0.8" />

    <!-- قله مرکزی شاهانه (طلایی براق) -->
    <polygon points="256,110 205,285 256,325 307,285" fill="url(#goldCrownGrad)" />
    <polygon points="256,110 256,325 205,285" fill="#FFFFFF" opacity="0.35" />

    <!-- ستاره درخشان ۴‌پر بالای قله -->
    <path d="M256 78 C256 96 247 105 229 105 C247 105 256 114 256 132 C256 114 265 105 283 105 C265 105 256 96 256 78 Z" fill="#FFFFFF" />

    <circle cx="165" cy="192" r="7" fill="#BAE6FD" />
    <circle cx="347" cy="192" r="7" fill="#A7F3D0" />
  </g>
</svg>
