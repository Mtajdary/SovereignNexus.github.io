<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- پس‌زمینه عمیق آبسیدین با هاله نوری -->
    <radialGradient id="polyBg" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="60%" stop-color="#06090e" />
      <stop offset="100%" stop-color="#010204" />
    </radialGradient>

    <!-- گرادیان کادر دور آیکون -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4285F4" />
      <stop offset="35%" stop-color="#FBBC05" />
      <stop offset="70%" stop-color="#34A853" />
      <stop offset="100%" stop-color="#EA4335" />
    </linearGradient>

    <!-- گرادیان وجوه الماس (Google Palette 3D) -->
    <!-- ۱. کلاهک بالایی (آبی پرنور گوگل) -->
    <linearGradient id="gBlueFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD" />
      <stop offset="40%" stop-color="#4285F4" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- ۲. وجه راست (سبز زمردی گوگل) -->
    <linearGradient id="gGreenFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A7F3D0" />
      <stop offset="40%" stop-color="#34A853" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- ۳. وجه چپ (قرمز/مرجانی گوگل) -->
    <linearGradient id="gRedFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCA5A5" />
      <stop offset="40%" stop-color="#EA4335" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>

    <!-- ۴. وجه مرکزی (طلایی کهربایی براق) -->
    <linearGradient id="gYellowFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="30%" stop-color="#FEF08A" />
      <stop offset="70%" stop-color="#FBBC05" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- لایه بازتاب صیقلی نور شیشه‌ای -->
    <linearGradient id="specularGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05" />
    </linearGradient>

    <!-- فیلتر هاله درخشش الماس -->
    <filter id="diamondGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- کادر آیکون موبایل -->
  <rect width="512" height="512" rx="124" fill="url(#polyBg)" stroke="url(#rimGrad)" stroke-width="5" />

  <!-- هاله نور مرکزی -->
  <circle cx="256" cy="260" r="140" fill="#FBBC05" opacity="0.16" filter="url(#diamondGlow)" />

  <!-- وکتور سه‌بعدی الماس منشوری گوگل -->
  <g filter="url(#diamondGlow)" transform="translate(0, 5)">
    <!-- ۱. کلاهک فوقانی الماس (آبی کریستالی) -->
    <polygon points="160,140 352,140 430,230 82,230" fill="url(#gBlueFacet)" />
    <!-- خط انعکاس بالایی -->
    <polygon points="160,140 352,140 320,175 192,175" fill="url(#specularGlow)" opacity="0.5" />

    <!-- ۲. وجه چپ پایینی (قرمز مرجانی) -->
    <polygon points="82,230 256,420 180,230" fill="url(#gRedFacet)" />
    <polygon points="82,230 180,230 140,290" fill="#991B1B" opacity="0.4" />

    <!-- ۳. وجه راست پایینی (سبز زمردی) -->
    <polygon points="430,230 256,420 332,230" fill="url(#gGreenFacet)" />
    <polygon points="430,230 332,230 372,290" fill="#064E3B" opacity="0.4" />

    <!-- ۴. وجه مخروطی جلو و مرکز (طلایی کهربایی) -->
    <polygon points="180,230 332,230 256,420" fill="url(#gYellowFacet)" />
    <!-- خط برش نور الماس مرکزی -->
    <polygon points="180,230 256,230 256,420" fill="#FFF" opacity="0.35" />

    <!-- ۵. جرقه ۴‌پر الماسی در گوشه بالایی -->
    <path d="M365 110 C365 125 355 135 340 135 C355 135 365 145 365 160 C365 145 375 135 390 135 C375 135 365 125 365 110 Z" fill="#FFFFFF" />
  </g>
</svg>
