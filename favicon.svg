<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="obsidianBg" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#181714" />
      <stop offset="60%" stop-color="#08080a" />
      <stop offset="100%" stop-color="#020408" />
    </radialGradient>

    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#D4AF37" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#78350F" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="facetTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="40%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <linearGradient id="facetLeftDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#5B3E12" />
      <stop offset="100%" stop-color="#1C1409" />
    </linearGradient>

    <linearGradient id="facetRightDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#78350F" />
      <stop offset="100%" stop-color="#261A0B" />
    </linearGradient>

    <linearGradient id="facetCenterGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#FEF08A" />
      <stop offset="65%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>

    <filter id="goldAura" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="124" fill="url(#obsidianBg)" stroke="url(#goldRim)" stroke-width="5" />

  <circle cx="256" cy="270" r="130" fill="#D4AF37" opacity="0.12" filter="url(#goldAura)" />

  <g filter="url(#goldAura)" transform="translate(0, 8)">
    <polygon points="160,140 352,140 430,230 82,230" fill="url(#facetTop)" />
    <polygon points="160,140 352,140 320,175 192,175" fill="#FFFFFF" opacity="0.4" />

    <polygon points="82,230 256,420 180,230" fill="url(#facetLeftDark)" />

    <polygon points="430,230 256,420 332,230" fill="url(#facetRightDark)" />

    <polygon points="180,230 332,230 256,420" fill="url(#facetCenterGold)" />
    <polygon points="180,230 256,230 256,420" fill="#FFFFFF" opacity="0.35" />

    <path d="M355 115 C355 130 345 140 330 140 C345 140 355 150 355 165 C355 150 365 140 380 140 C365 140 355 130 355 115 Z" fill="#FFFFFF" />
  </g>
