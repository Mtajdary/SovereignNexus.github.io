<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b18" />
      <stop offset="100%" stop-color="#050505" />
    </radialGradient>
    <linearGradient id="goldSpark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#D4AF37" stroke-width="4" stroke-opacity="0.3" />
  
  <!-- ستاره اصلی گوگل لبز -->
  <path d="M256 64 C256 169.9 169.9 256 64 256 C169.9 256 256 342.1 256 448 C256 342.1 342.1 256 448 256 C342.1 256 256 169.9 256 64 Z" 
        fill="url(#goldSpark)" 
        filter="url(#glow)" />
        
  <!-- جرقه ثانویه کوچک تر -->
  <path d="M380 90 C380 115 360 135 335 135 C360 135 380 155 380 180 C380 155 400 135 425 135 C400 135 380 115 380 90 Z" 
        fill="#FFF3C4" 
        opacity="0.85" />
</svg>
