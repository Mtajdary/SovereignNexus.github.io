      <stop offset="45%" stop-color="#FEF08A"/>
      <stop offset="75%" stop-color="#F59E0B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>

    <filter id="ultraGlow" x="-25%" y="-25%" width="150%" height="150%">
