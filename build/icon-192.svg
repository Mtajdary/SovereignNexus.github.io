  <rect width="512" height="512" rx="128" fill="url(#nebulaBg)" stroke="url(#goldRim)" stroke-width="4"/>

  <circle cx="256" cy="256" r="140" fill="#F59E0B" opacity="0.18" filter="url(#ultraGlow)"/>

  <g opacity="0.35" filter="url(#ultraGlow)" transform="rotate(45 256 256)">
    <path d="M256 90 C256 185 185 256 90 256 C185 256 256 327 256 422 C256 327 327 256 422 256 C327 256 256 185 256 90 Z" fill="url(#solarGoldGrad)"/>
  </g>

  <g filter="url(#ultraGlow)">
    <path d="M256 42 C256 168 168 256 42 256 C168 256 256 344 256 470 C256 344 344 256 470 256 C344 256 256 168 256 42 Z" fill="url(#solarGoldGrad)"/>
    <path d="M256 70 C256 180 180 256 70 256 C180 256 256 332 256 442 C256 332 332 256 442 256 C332 256 256 180 256 70 Z" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-opacity="0.5"/>
    <circle cx="256" cy="256" r="100" fill="url(#solarCore)"/>
    <path d="M388 92 C388 116 368 136 344 136 C368 136 388 156 388 180 C388 156 408 136 432 136 C408 136 388 116 388 92 Z" fill="#FFF" opacity="0.95"/>
    <circle cx="388" cy="136" r="3" fill="#FFFFFF"/>
