<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- پس زمینه گرادیانی فوق شفاف کیهانی -->
    <radialGradient id="hdBg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#182234" />
      <stop offset="50%" stop-color="#0a0f18" />
      <stop offset="100%" stop-color="#020408" />
    </radialGradient>

    <!-- کادر نورانی دور آیکون -->
    <linearGradient id="hdBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.9" />
    </linearGradient>

    <!-- گرادیان طلایی براق قله وسط -->
    <linearGradient id="goldPeak" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="20%" stop-color="#FFF5A5" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="85%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <!-- گرادیان کریستال چپ (آبی کوبالت نئونی) -->
    <linearGradient id="blueFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD" />
      <stop offset="35%" stop-color="#38BDF8" />
      <stop offset="70%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>

    <!-- گرادیان کریستال راست (زمردی نئونی) -->
    <linearGradient id="greenFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D1FAE5" />
      <stop offset="35%" stop-color="#34D399" />
      <stop offset="70%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>

    <!-- گرادیان پایه تاج -->
    <linearGradient id="baseBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- افکت هاله نوری شارپ -->
    <filter id="hdGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- کادر پایه آیکون سازگار با ماسک اندروید و iOS -->
  <rect width="512" height="512" rx="128" fill="url(#hdBg)" stroke="url(#hdBorder)" stroke-width="6" />

  <!-- هاله نور طلایی پس‌زمینه -->
  <circle cx="256" cy="270" r="140" fill="#F59E0B" opacity="0.18" filter="url(#hdGlow)" />

  <g filter="url(#hdGlow)" transform="translate(0, 15)">
    <!-- پایه پیوسته زیرین تاج -->
    <path d="M120 350 Q 256 385 392 350 L380 372 Q 256 405 132 372 Z" fill="url(#baseBar)" />

    <!-- بال کریستالی چپ -->
    <polygon points="128,340 165,190 215,280 180,340" fill="url(#blueFacet)" />
    <polygon points="165,190 256,238 215,280" fill="#1D4ED8" opacity="0.85" />

    <!-- بال کریستالی راست -->
    <polygon points="384,340 347,190 297,280 332,340" fill="url(#greenFacet)" />
    <polygon points="347,190 297,280 256,238" fill="#047857" opacity="0.85" />

    <!-- قله مرکزی طلایی براق و متالیک -->
    <polygon points="256,105 205,285 256,330 307,285" fill="url(#goldPeak)" />
    <polygon points="256,105 256,330 205,285" fill="#FFFFFF" opacity="0.38" />

    <!-- جرقه درخشان ۴‌پر در راس قله -->
    <path d="M256 75 C256 94 246 104 226 104 C246 104 256 114 256 133 C256 114 266 104 286 104 C266 104 256 94 256 75 Z" fill="#FFFFFF" />

    <!-- نگین‌های قله‌های کناری -->
    <circle cx="165" cy="188" r="7" fill="#BAE6FD" />
    <circle cx="347" cy="188" r="7" fill="#A7F3D0" />
  </g>
</svg>
