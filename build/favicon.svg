<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- پس‌زمینه عمیق با گوی نوری -->
    <radialGradient id="appBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="70%" stop-color="#050811" />
      <stop offset="100%" stop-color="#020408" />
    </radialGradient>

    <!-- گرادیان بال چپ (آبی لاجوردی لبز) -->
    <linearGradient id="facetLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="40%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- گرادیان قله اصلی و مرکزی (طلایی آتشین پرایم) -->
    <linearGradient id="facetCenter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="25%" stop-color="#FDE047" />
      <stop offset="65%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- گرادیان بال راست (زمردی نئونی) -->
    <linearGradient id="facetRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="40%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- گرادیان پایه و پایینی (یاقوتی / سان‌ست) -->
    <linearGradient id="facetBase" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <!-- افکت درخشش و بلور نئونی -->
    <filter id="polyGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <linearGradient id="ringBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- کادر گرد آیکون موبایل -->
  <rect width="512" height="512" rx="120" fill="url(#appBg)" stroke="url(#ringBorder)" stroke-width="6" />

  <!-- هاله نوری در پس‌زمینه تاج -->
  <circle cx="256" cy="256" r="140" fill="#F59E0B" opacity="0.15" filter="url(#polyGlow)" />

  <g filter="url(#polyGlow)">
    <!-- ۱. وجه پایه پایینی -->
    <polygon points="128,348 256,408 384,348 256,368" fill="url(#facetBase)" opacity="0.95" />

    <!-- ۲. وجه چپ تاج (آبی پلی) -->
    <polygon points="128,190 200,280 128,348 100,260" fill="url(#facetLeft)" />
    <polygon points="128,190 256,230 200,280" fill="#2563EB" opacity="0.85" />

    <!-- ۳. وجه راست تاج (زمردی پلی) -->
    <polygon points="384,190 412,260 384,348 312,280" fill="url(#facetRight)" />
    <polygon points="384,190 312,280 256,230" fill="#059669" opacity="0.85" />

    <!-- ۴. وجه مرکزی قله بزرگ (طلایی درخشان) -->
    <polygon points="256,104 200,280 256,368 312,280" fill="url(#facetCenter)" />
    
    <!-- خطوط درخشش منشوری داخلی -->
    <polygon points="256,104 256,368 200,280" fill="#FFFBEB" opacity="0.35" />

    <!-- ۵. جرقه‌های ۴‌پر گوگل لبز در راس قله‌ها -->
    <!-- قله وسط -->
    <path d="M256 74 C256 94 246 104 226 104 C246 104 256 114 256 134 C256 114 266 104 286 104 C266 104 256 94 256 74 Z" fill="#FFFFFF" />
    
    <!-- قله چپ -->
    <path d="M128 165 C128 180 120 190 105 190 C120 190 128 200 128 215 C128 200 136 190 151 190 C136 190 128 180 128 165 Z" fill="#93C5FD" />

    <!-- قله راست -->
    <path d="M384 165 C384 180 376 190 361 190 C376 190 384 200 384 215 C384 200 392 190 407 190 C392 190 384 180 384 165 Z" fill="#A7F3D0" />
  </g>
</svg>
